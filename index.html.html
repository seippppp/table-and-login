<!DOCTYPE html>
<html>
<head>
<style>
  /* Style untuk Tabel */
  table {
    font-family: arial, sans-serif;
    border-collapse: collapse;
    width: 60%;
    margin-bottom: 30px;
  }

  td, th {
    border: 1.5px solid #000000;
    text-align: center;
    padding: 8px;
  }

  thead tr {
    background-color: #0066b2;
    color: white;
  }

  /* Style untuk Form Login */
  fieldset {
    width: 400px;
    border: 1px solid #ccc;
    font-family: arial, sans-serif;
    padding: 15px;
  }

  legend {
    padding: 0 5px;
  }

  .form-group {
    margin: 10px 0;
    display: flex;
    align-items: center;
  }

  label {
    width: 90px;
    font-size: 14px;
  }

  input[type="text"], input[type="password"] {
    padding: 4px;
    flex: 1;
    max-width: 200px;
    border: 1px solid #ccc;
  }

  input[type="password"] {
    border-color: #5bc0de;
    outline: none;
    box-shadow: 0 0 4px #5bc0de;
  }

  .checkbox-group {
    margin-left: 90px;
    margin-top: 15px;
    font-size: 14px;
  }

  button {
    margin-left: 90px;
    margin-top: 10px;
    padding: 3px 15px;
    cursor: pointer;
    background-color: #f0f0f0;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<h2>1. Membuat Tabel</h2>

<table>
  <thead>
    <tr>
      <th rowspan="2">Nama</th>
      <th colspan="3">Nilai</th>
    </tr>
    <tr>
      <th>Kimia</th>
      <th>Fisika</th>
      <th>Biologi</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>Robby</td>
      <td>76</td>
      <td>80</td>
      <td>81</td>
    </tr>
    <tr>
      <td>Rendi</td>
      <td>84</td>
      <td>70</td>
      <td>75</td>
    </tr>
    <tr>
      <td>Alfian</td>
      <td>96</td>
      <td>70</td>
      <td>71</td>
    </tr>
  </tbody>
</table>

<h2>2. Membuat Login</h2>

<form>
  <fieldset>
    <legend>Login</legend>
    
    <div class="form-group">
      <label>Username:</label>
      <input type="text" name="username" value="petanikode">
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" name="password" value="password123">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="remember">
      <label for="remember">Remember me</label>
    </div>

    <button type="submit">Login</button>
  </fieldset>
</form>

</body>
</html>
